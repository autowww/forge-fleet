# Granite production runner — host Ollama on loopback; Open WebUI bypass unchanged.
#
# Catalog alignment (configs/catalog/forge_llm_README.md, T2000 4 GB):
#   "use Qwen3.5-2B Q4 or specialized NLP candidates first; keep 5–10 clients queued,
#    start with 2 measured *active* requests."
# Pins with a catalog_alias are routed by the catalog task matrix at the 4 GB tier.
# Pins without an alias (8B/14B/30B) are operator legacy tags: they exceed the 4 GB
# nominal tier estimate and are served only via mode_models / explicit model requests
# until a measured profile is recorded (see RUNNER.md "Artifact pins").
kind: ollama
bind: 127.0.0.1:11434
runtime: {}
exclusive_slot: false
classifier_model: ibm/granite4:tiny-h
free_vram_gb: 4
headroom_ratio: 0.15
catalog_path: catalog/forge_llm_catalog_2026-11-03.json
coalesce_sec: 3
starve_sec: 120
max_active_requests: 2
max_queue_depth: 10
external:
  openwebui_base_url: http://127.0.0.1:19808
  chatgpt_model: granite-chatgpt-primary
  gemini_model: granite-gemini-primary
  max_concurrent: 4
quarantined_models:
  - ctx-unlim-qwen25-coder-7b:latest
  - qwen2.5-coder:7b
artifact_pins:
  # --- 4 GB tier catalog candidates (Q4 unless noted) ---
  - runner_model_id: qwen3.5:2b-q4_K_M  # exact Q4 artifact (1.95 GB); bare qwen3.5:2b tag is the 2.7 GB Q8 build
    catalog_alias: Q2            # Qwen/Qwen3.5-2B — chat, json, intent, summary, translation, reason_simple, agent
    precision: Q4_K_M
    enabled: true
    model_revision: sha256:1e2d21a4f03ab9e4a9c1976a4b7e88f21de61d65f2c5485d8fde8942be73f1e7
    weight_file_sha256: sha256:20cb277f0967ace47b0b5d5658e5e494a88937f7378b74b5a266496400938f4c
    runtime_probe: passed
    license_approval: true
    measured:
      peak_vram_mib: 1147
      context_length: 4096
      active_requests: 1
      p95_latency_ms: 12760
      task_quality_score: 1.0
      runtime_version: ollama 0.30.0
  - runner_model_id: qwen2.5-coder:3b
    catalog_alias: C3            # Qwen/Qwen2.5-Coder-3B-Instruct — code_complete, code_generate, testgen
    precision: Q4_K_M
    enabled: true
  - runner_model_id: qwen3-embedding:0.6b
    catalog_alias: E06           # Qwen/Qwen3-Embedding-0.6B — embedding, code_search
    precision: FP16
    enabled: true
  # --- operator legacy tags (above 4 GB nominal tier; not catalog-certified) ---
  - runner_model_id: ctx-unlim-qwen3-8b:latest
    tier_note: exceeds_4gb_nominal_tier_estimate_unmeasured
    enabled: true
  - runner_model_id: qwen3:30b-a3b
    tier_note: moe_total_params_govern_memory_exceeds_4gb_unmeasured
    enabled: true
  - runner_model_id: ctx-unlim-qwen3-14b:latest
    tier_note: exceeds_4gb_nominal_tier_estimate_unmeasured
    enabled: true
  - runner_model_id: ctx-unlim-granite41-8b:latest
    tier_note: exceeds_4gb_nominal_tier_estimate_unmeasured
    enabled: true
  - runner_model_id: nomic-embed-text:latest
    tier_note: legacy_embedding_not_in_catalog
    enabled: true
  - runner_model_id: ibm/granite4:tiny-h
    tier_note: classifier_only_not_in_catalog
    enabled: true
models:
  - qwen3.5:2b-q4_K_M
  - qwen2.5-coder:3b
  - qwen3-embedding:0.6b
  - qwen3:30b-a3b
  - ctx-unlim-qwen3-8b:latest
  - ctx-unlim-qwen3-14b:latest
  - ctx-unlim-granite41-8b:latest
  - nomic-embed-text:latest
  - ibm/granite4:tiny-h
mode_models:
  interactive: ctx-unlim-qwen3-8b:latest
  task_code: qwen3:30b-a3b
  struct_json: ctx-unlim-qwen3-8b:latest
  reason_short: qwen3:30b-a3b
  long_ctx: ctx-unlim-qwen3-14b:latest
  codegen_loop: ctx-unlim-granite41-8b:latest
  embed: nomic-embed-text:latest
  batch_eval: ctx-unlim-qwen3-14b:latest
