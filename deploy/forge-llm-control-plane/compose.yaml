# Minimal forge-gateway control plane (host Ollama). Shipped inside forge-fleet for Granite rollout.
name: forge-llm-control-plane

services:
  forge-gateway:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    build:
      context: ./apps/forge-gateway
      dockerfile: Dockerfile
    image: forge-gateway:control-plane
    container_name: forge-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_INTERNAL_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      GATEWAY_AUTH_REQUIRED: ${GATEWAY_AUTH_REQUIRED:-true}
      FORGE_API_TOKEN: ${FORGE_API_TOKEN:-}
      LLM_API_KEY: ${FORGE_API_TOKEN:-}
      FORGE_LLM_DB_PATH: /data/forge-llm.sqlite
      FLEET_WAKE_BASE_URL: ${FLEET_WAKE_BASE_URL:-http://host.docker.internal:18766}
      FLEET_WAKE_BEARER_TOKEN: ${FLEET_WAKE_BEARER_TOKEN:-${FORGE_API_TOKEN:-}}
    volumes:
      - gateway_state:/data
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gateway_state:
    name: forge_gateway_control_plane_state
