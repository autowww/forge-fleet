# Forge 2B PoC on Granite: forge-dcs (ingest + STRICT compile) + forge-2b OpenAI-compatible shim.
# The shim talks to the forge-llm gateway on the host (:18080) and is reachable from Open WebUI as
# http://forge-2b:9085/v1 over the Open WebUI compose network. Code arrives via git only
# (vendor/ is synced by scripts/sync-forge-2b-poc.sh); secrets live in ${FORGE_2B_ENV_FILE}.
name: forge-2b-poc

services:
  forge-dcs:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-2b-poc:latest
    container_name: forge-dcs
    restart: unless-stopped
    command: ["uvicorn", "forge_dcs.api:app", "--host", "0.0.0.0", "--port", "9793"]
    env_file:
      - ${FORGE_2B_ENV_FILE:?set FORGE_2B_ENV_FILE}
    environment:
      DCS_STORE_ROOT: /var/lib/forge-dcs/store
    volumes:
      - dcs_store:/var/lib/forge-dcs/store
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9793/v1/capabilities', timeout=3).status in (200,401) else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  forge-2b:
    image: forge-2b-poc:latest
    container_name: forge-2b
    restart: unless-stopped
    depends_on:
      forge-dcs:
        condition: service_started
    command: ["uvicorn", "forge_2b.facade:app", "--host", "0.0.0.0", "--port", "9085"]
    env_file:
      - ${FORGE_2B_ENV_FILE:?set FORGE_2B_ENV_FILE}
    environment:
      DCS_BASE_URL: http://forge-dcs:9793
      FORGE_2B_LLM_BASE_URL: ${FORGE_2B_LLM_BASE_URL:-http://host.docker.internal:18080/v1}
      FORGE_2B_ENABLE_LIVE: "1"
      FORGE_2B_CACHE_DIR: /var/lib/forge-2b/cache
      FORGE_2B_LLM_TIMEOUT: ${FORGE_2B_LLM_TIMEOUT:-180}
      FORGE_2B_MAX_WINDOWS: ${FORGE_2B_MAX_WINDOWS:-200}
      FORGE_2B_WINDOW_CHARS: ${FORGE_2B_WINDOW_CHARS:-3200}
      FORGE_2B_TOP_N: ${FORGE_2B_TOP_N:-60}
    volumes:
      - shim_cache:/var/lib/forge-2b/cache
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9085/healthz', timeout=3).status == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
      - openwebui

volumes:
  dcs_store:
    name: forge_2b_dcs_store
  shim_cache:
    name: forge_2b_shim_cache

networks:
  internal:
    name: forge_2b_internal
  openwebui:
    external: true
    name: ${OPEN_WEBUI_NETWORK:-forge-open-webui_default}
