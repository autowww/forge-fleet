# Forge 2B PoC on Granite: forge-dcs (ingest + STRICT compile) + forge-2b OpenAI-compatible shim.
# The shim talks to the forge-llm gateway over its compose network (forge-gateway:8080) and is reachable
# from Open WebUI as http://forge-2b:9085/v1 over the Open WebUI compose network. Code arrives via git only
# (vendor/ is synced by scripts/sync-forge-2b-poc.sh); secrets live in ${FORGE_2B_ENV_FILE}.
name: forge-2b-poc

services:
  forge-dcs:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-2b-poc:latest
    container_name: forge-dcs
    restart: unless-stopped
    command: ["uvicorn", "forge_dcs.api:app", "--host", "0.0.0.0", "--port", "9793"]
    env_file:
      - ${FORGE_2B_ENV_FILE:-${HOME}/.config/forge-2b-poc/forge-2b.env}
    environment:
      DCS_STORE_ROOT: /var/lib/forge-dcs/store
    volumes:
      - dcs_store:/var/lib/forge-dcs/store
    healthcheck:
      # /v1/capabilities is bearer-protected: a 401 still proves the API is serving
      test: ["CMD", "python3", "-c", "import urllib.request,urllib.error,sys\ntry:\n  sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9793/v1/capabilities', timeout=3).status == 200 else 1)\nexcept urllib.error.HTTPError as e:\n  sys.exit(0 if e.code == 401 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  forge-2b:
    image: forge-2b-poc:latest
    container_name: forge-2b
    restart: unless-stopped
    depends_on:
      forge-dcs:
        condition: service_started
    command: ["uvicorn", "forge_2b.facade:app", "--host", "0.0.0.0", "--port", "9085"]
    env_file:
      - ${FORGE_2B_ENV_FILE:-${HOME}/.config/forge-2b-poc/forge-2b.env}
    environment:
      DCS_BASE_URL: http://forge-dcs:9793
      # gateway publishes only on 127.0.0.1:18080; reach it over its compose network instead
      FORGE_2B_LLM_BASE_URL: ${FORGE_2B_LLM_BASE_URL:-http://forge-gateway:8080/v1}
      FORGE_2B_ENABLE_LIVE: "1"
      FORGE_2B_CACHE_DIR: /var/lib/forge-2b/cache
      FORGE_2B_LLM_TIMEOUT: ${FORGE_2B_LLM_TIMEOUT:-180}
      # tuned on the NVDA FY26 10-K etalon (forge-2b-poc artifacts/P2B-GRAPH): smaller windows + top-80 with category caps
      FORGE_2B_MAX_WINDOWS: ${FORGE_2B_MAX_WINDOWS:-240}
      FORGE_2B_WINDOW_CHARS: ${FORGE_2B_WINDOW_CHARS:-2000}
      FORGE_2B_TOP_N: ${FORGE_2B_TOP_N:-80}
      # Deterministic Comprehension Engine (forge-2b-poc DCE-04): off = legacy lane byte-identical; shadow = trace only; on = DCE answers
      FORGE_2B_DCE_MODE: ${FORGE_2B_DCE_MODE:-off}
      FORGE_2B_DCE_MAX_MODEL_CALLS: ${FORGE_2B_DCE_MAX_MODEL_CALLS:-3}
      FORGE_2B_DCE_PLAN_MS: ${FORGE_2B_DCE_PLAN_MS:-3000}
      FORGE_2B_DCE_CONCURRENCY: ${FORGE_2B_DCE_CONCURRENCY:-2}
      # Bundled declarative skill (image: /app/skills/sec-10k-impact); override for experiments
      FORGE_2B_SKILL_DIR: ${FORGE_2B_SKILL_DIR:-/app/skills/sec-10k-impact}
    volumes:
      - shim_cache:/var/lib/forge-2b/cache
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9085/healthz', timeout=3).status == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
      - openwebui
      - gateway

volumes:
  dcs_store:
    name: forge_2b_dcs_store
  shim_cache:
    name: forge_2b_shim_cache

networks:
  internal:
    name: forge_2b_internal
  openwebui:
    external: true
    name: ${OPEN_WEBUI_NETWORK:-forge-open-webui_default}
  gateway:
    external: true
    name: ${FORGE_LLM_NETWORK:-forge-llm-control-plane_default}
