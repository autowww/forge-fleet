# Granite host overlay — publish Market Studio and Postgres on loopback.
# appdata volume MUST be env-scoped (FORGE_MARKET_APPDATA_VOLUME) so operator
# data-plane-pref.json is not shared across prod/dev/clean stacks.
volumes:
  pgdata:
    name: ${FORGE_MARKET_PGDATA_VOLUME:-forge_market_studio_pgdata}
    external: true
  appdata:
    name: ${FORGE_MARKET_APPDATA_VOLUME:-forge_market_studio_data}
    external: true

services:
  postgres:
    ports:
      - "127.0.0.1:${FORGE_MARKET_POSTGRES_HOST_PORT:-15432}:5432"

  market-app:
    ports:
      - "127.0.0.1:${FORGE_MARKET_STUDIO_HOST_PORT:-19792}:9792"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FORGE_MARKET_BIND_HOST: "0.0.0.0"
      FORGE_MARKET_CONTAINER: "1"
      FORGE_MARKET_GRANITE_EDGE: "1"
      FORGE_MARKET_STUDIO_API_TOKEN: ${FORGE_MARKET_STUDIO_API_TOKEN:-}
      FORGE_MARKET_STUDIO_ALLOW_ANON: ${FORGE_MARKET_STUDIO_ALLOW_ANON:-1}
      FORGE_MARKET_API_ONLY: ${FORGE_MARKET_API_ONLY:-1}
      FORGE_MARKET_ANALYSIS_ENABLED: ${FORGE_MARKET_ANALYSIS_ENABLED:-true}
      FORGE_MARKET_SEC_CONTACT: ${FORGE_MARKET_SEC_CONTACT:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-ctx-unlim-qwen3-8b:latest}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-300}
      FORGE_MARKET_CDP_URL: ${FORGE_MARKET_CDP_URL:-http://host.docker.internal:9222}
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN:-}
      IBKR_FLEX_NAV_QUERY_ID: ${IBKR_FLEX_NAV_QUERY_ID:-}
      IBKR_FLEX_TRADES_QUERY_ID: ${IBKR_FLEX_TRADES_QUERY_ID:-}
      IBKR_FLEX_POSITIONS_QUERY_ID: ${IBKR_FLEX_POSITIONS_QUERY_ID:-}
      IBKR_FLEX_CASH_QUERY_ID: ${IBKR_FLEX_CASH_QUERY_ID:-}
