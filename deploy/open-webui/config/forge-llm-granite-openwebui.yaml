# Granite Open WebUI ↔ forge-gateway catalog (UI labels + optional forge_task for docs/tests).
# Served model ids must match artifact_pins in forge-llm configs/runner.granite.yaml.
# 4 GB-tier catalog pins come first (catalog README: Qwen3.5-2B Q4 / specialized candidates
# first on T2000 4 GB); legacy 8B/14B/30B tags follow and are above the nominal tier.
gateway:
  connection_label: forge-llm-granite
  docker_base_url: http://host.docker.internal:18080/v1
  loopback_base_url: http://127.0.0.1:18080/v1
  bearer_env: FORGE_LLM_GATEWAY_BEARER
  auth_header: Authorization
models:
  - id: qwen3.5:2b
    label: Chat — Qwen3.5 2B (4 GB tier, catalog Q2)
    forge_task: chat
    catalog_alias: Q2
  - id: qwen2.5-coder:3b
    label: Code — Qwen2.5 Coder 3B (4 GB tier, catalog C3)
    forge_task: code_generate
    catalog_alias: C3
  - id: qwen3-embedding:0.6b
    label: Embeddings — Qwen3 Embedding 0.6B (catalog E06)
    forge_task: embedding
    catalog_alias: E06
  - id: ctx-unlim-qwen3-8b:latest
    label: Chat — Qwen3 8B (legacy, above 4 GB tier)
    forge_task: chat
  - id: qwen3:30b-a3b
    label: Code — Qwen3 30B MoE (legacy, above 4 GB tier)
    forge_task: code_generate
  - id: ctx-unlim-qwen3-14b:latest
    label: Long context — Qwen3 14B (legacy, above 4 GB tier)
    forge_task: long_docs
  - id: ctx-unlim-granite41-8b:latest
    label: Codegen loop — Granite 4.1 8B (legacy, above 4 GB tier)
    forge_task: code_repo
  - id: nomic-embed-text:latest
    label: Embeddings — nomic (legacy)
    forge_task: embedding
  - id: ibm/granite4:tiny-h
    label: Classifier — Granite4 tiny (routing only)
    forge_task: intent
external_bridges:
  - slug: chatgpt-primary
    model_prefix: granite-chatgpt-primary
  - slug: gemini-primary
    model_prefix: granite-gemini-primary
